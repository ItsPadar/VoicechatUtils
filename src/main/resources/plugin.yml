name: voicechatutils
version: $version
main: itspadar.voicechatutils.VoicechatUtils
api-version: '1.21'
prefix: VoicechatUtils
authors: [ Its_Padar ]
website: https://modrinth.com/plugin/voicechat-utils
description: Add a way for players without mics to use voice chat groups!
depend: [ voicechat ]
permissions:
  voicechatutils.chat.use:
    description: "Use `/messagegroup` to message users in current voice chat group"
    default: true
  voicechatutils.chat.spy:
    description: "See all messages sent using `/messagegroup`"
    default: op
  voicechatutils.mute:
    description: "Mute and unmute players in voice chat with `/vcmute`, `/vcunmute` and `/vcmutes`, and see mute announcements"
    default: op
commands:
  messagegroup:
    description: "Message players in the current voice chat group!"
    usage: "/mg <message you want to send>"
    aliases: [ mg ]
    permission: voicechatutils.chat.use
  mgtoggle:
    description: "Toggle all messages being sent to the current voice chat group!"
    usage: "/mgtoggle [<on|off>]"
    aliases: [ messagegrouptoggle ]
    permission: voicechatutils.chat.use
  vcmute:
    description: "Mute a player in voice chat, optionally for a set amount of time"
    usage: "/vcmute <player> [duration, e.g. 30s, 10m, 2h, 7d, 1h30m] [reason]"
    permission: voicechatutils.mute
  vcunmute:
    description: "Unmute a player in voice chat"
    usage: "/vcunmute <player>"
    permission: voicechatutils.mute
  vcmutes:
    description: "List all players that are muted in voice chat"
    usage: "/vcmutes"
    aliases: [ vcmutelist ]
    permission: voicechatutils.mute
